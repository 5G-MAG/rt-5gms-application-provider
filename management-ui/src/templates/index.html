<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>5GMS Application Provider</title>
  <link rel="shortcut icon" type="image/png" href="src/static/images/favico.png" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/style.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.22/dist/sweetalert2.min.css" rel="stylesheet">
  <script type="module" src="src/provisioning-interface.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.22/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>


<body>

<header class="app-header">
  <div class="header-left">
    <img src="src/static/images/5gmag.png" alt="5G-MAG" class="header-logo">
  </div>

  <div class="header-center text-center">
    <h2>5GMS Application Provider</h2>
    <div class="status-row">
      <div id="af-status" class="af-badge af-ok" aria-live="polite">
        <span class="af-dot"></span>
        Application Function connected
      </div>
    </div>
  </div>

</header>

  <main class="container text-center">
    <div class="button-group my-3">
      <button onclick="createNewSession()" class="btn btn-primary">Create 5G Media Streaming Session</button>
      <button onclick="openDetailsForSelected()" class="btn btn-primary">Details For Selected Sessions</button>
      <button onclick="deleteSelectedSessions()" class="btn btn-danger">Delete Selected</button>
      <button onclick="commitSelectedSessionsToM8()" class="btn btn-warning">Publish Selected Sessions To M8</button>
    </div>

    <div class="table-responsive table-scroll">
      <table id="m1_table" class="table table-bordered">
        <thead>
          <tr>
            <th>Provisioning Session ID</th>
            <th>Content Hosting Configuration</th>
            <th>Server Certificates</th>
            <th>Content Protocols</th>
            <th>Consumption Reporting Configuration</th>
            <th>Dynamic Policy</th>
            <th>Metrics Reporting</th>
            <th>Session Details</th>
            
            <th>
              <button id="toggle-select-btn"
                      class="btn btn-primary fixed-toggle-btn"
                      onclick="toggleSelectAll()">
                Select all sessions
              </button>
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="text-center my-4">
    <button id="scrollTopBtn" class="btn btn-light">↑</button>
    <button id="infoBtn" class="btn btn-info">i</button>
  </div>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p> For full license terms, see the LICENSE file or <a
          href="https://drive.google.com/file/d/1cinCiA778IErENZ3JN52VFW-1ffHpx7Z/view" target="_blank">click here</a>.
      </p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('infoModal');
    const btn = document.getElementById('infoBtn');
    const span = document.getElementsByClassName("close")[0];

    btn.onclick = () => {
      modal.style.display = "block";
      modal.classList.remove("modal-hiding");
    };

    span.onclick = () => {
      modal.classList.add("modal-hiding");
      setTimeout(() => modal.style.display = "none", 400);
    };

    window.onclick = (event) => {
      if (event.target === modal) {
        modal.classList.add("modal-hiding");
        setTimeout(() => modal.style.display = "none", 400);
      }
    };
  </script>

</body>
</html>
