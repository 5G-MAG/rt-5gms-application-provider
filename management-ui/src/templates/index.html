<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>5G Media Streaming - Application Provider Portal</title>
  <link rel="shortcut icon" type="image/png" href="src/static/images/favicon.png" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="/src/shared.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.22/dist/sweetalert2.min.css" rel="stylesheet">
  <script type="module" src="src/provisioning-interface.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.22/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>


<body>

<nav class="portal-switcher">
  <a href="/" class="switcher-tab active">Application Provider Portal</a>
  <a href="/monitor/" class="switcher-tab">QoE Metrics and Consumption Reports</a>
  <a href="/cmcd-reports/" class="switcher-tab">CMCD Reports</a>
</nav>

<header class="app-header portal-main-header">
  <div class="header-left">
    <img src="src/static/images/5gmag.png" alt="5G-MAG" class="header-logo">
  </div>

  <div class="header-center">
    <h2 class="header-title">5G Media Streaming - Application Provider Portal</h2>
  </div>

  <div class="header-right">
    <label id="maf-auto-discover-wrap" class="refresh-btn maf-sync-btn">
      <input id="maf-auto-discover-toggle" type="checkbox" style="position:absolute;opacity:0;pointer-events:none;">
      ↺ Sync AF
    </label>
  </div>
</header>

  <div class="mgmt-topbar">
    <div id="session-count-badge" class="session-count-badge">
      <span id="session-count">0</span> provisioning sessions
    </div>
    <div id="af-status" class="af-status-badge af-ok" aria-live="polite">
      <span class="af-dot"></span>
      <span id="af-status-text">Application Function connected</span>
    </div>
  </div>

  <main class="container text-center">

    <div class="button-group">
      <button onclick="createNewSession()" class="btn btn-primary">Create 5GMS Provisioning Session</button>
      <button onclick="openDetailsForSelected()" class="btn btn-primary">Details For Selected Sessions</button>
      <button onclick="deleteSelectedSessions()" class="btn btn-danger">Delete Selected</button>
      <button id="toggle-select-btn" onclick="toggleSelectAll()" class="btn btn-secondary" disabled>Select all sessions</button>
      <button onclick="openM8()" class="btn btn-warning">Open M8 JSON</button>
      <button onclick="exportPSConfiguration()" class="btn btn-success">
        <span class="glyphicon glyphicon-cloud-download" aria-hidden="true"></span>Export
      </button>
      <button onclick="importPSConfiguration()" class="btn btn-danger">
        <span class="glyphicon glyphicon-cloud-upload" aria-hidden="true"></span>Import
      </button>
    </div>

    <div id="sessions-list"></div>
  </main>

  <button id="infoBtn" class="btn btn-info">i</button>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p> For full license terms, see the LICENSE file or <a
          href="https://hub.5g-mag.com/Getting-Started/OFFICIAL_5G-MAG_Public_License_v1.0.pdf" target="_blank">click here</a>.
      </p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('infoModal');
    const btn = document.getElementById('infoBtn');
    const span = document.getElementsByClassName("close")[0];

    btn.onclick = () => {
      modal.style.display = "block";
      modal.classList.remove("modal-hiding");
    };

    span.onclick = () => {
      modal.classList.add("modal-hiding");
      setTimeout(() => modal.style.display = "none", 400);
    };

    window.onclick = (event) => {
      if (event.target === modal) {
        modal.classList.add("modal-hiding");
        setTimeout(() => modal.style.display = "none", 400);
      }
    };
  </script>

</body>
</html>
